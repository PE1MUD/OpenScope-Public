; Philips PM5644 G00 Pattern ROM set
; Put this file in the same directory as the ten original EPROM dumps.
;
; The decoder itself knows only the roles below. Other ROM sets can use
; different filenames and vector-table locations by supplying another INI.

[Set]
Name=Philips PM5644 G00
Shortname=PM5644 G00
Standard=PAL
Decoder=PM5644_3BYTE

[ROM]
Luma0=EPROM_4008_102_56191_CSUM_9A6A.bin
Luma1=EPROM_4008_102_56201_CSUM_4E67.bin
Luma2=EPROM_4008_102_56211_CSUM_3172.bin
Luma3=EPROM_4008_102_56221_CSUM_7F95.bin
LumaLSB=EPROM_4008_102_56231_CSUM_78C4.bin
RY0=EPROM_4008_102_56241_CSUM_F0DF.bin
RY1=EPROM_4008_102_56251_CSUM_F397.bin
BY0=EPROM_4008_102_56261_CSUM_2DA9.bin
BY1=EPROM_4008_102_56271_CSUM_2E0F.bin
CPU=EPROM_4008_102_59371_CSUM_A100.bin

[VectorTable]
Start=0x52F6
Length=0x0D98

[Pattern]
; G00 contains two PAL phase frames in this table.
Index=2
Frame=0
AlternateFrames=true

[Line]
; Lengths are in ROM addresses. Y has 4 samples/address, chroma 2.
BackAddresses=64
CentreAddresses=120
FrontAddresses=32

[Output]
; Complete ROM line = 864 Y samples. OpenScope capture raster = 720x576.
Width=720
Height=576
CropX=138

[Levels]
; PM5644 G00 stores DAC drive codes, not BT.601 code values.
; These anchors are documented by the original PhilipsPatternRom converter.
YRawBlack=724
YRawWhite=164
YDigitalBlack=64
YDigitalWhite=940

; Chroma EPROMs are 8-bit offset-binary DAC codes.
; Positive BT.601 chroma excursion is 848 (512 + 336).
ChromaDigitalCentre=512
ChromaDigitalPositive=848
RYRawCentre=128
RYRawAtPositive=63
BYRawCentre=128
BYRawAtPositive=82

[Timing]
LumaSampleRateHz=13500000
ChromaSampleRateHz=6750000

[Chroma]
; Measured against the G00 colour-bar transitions.
PhaseLumaSamples=2.0
Gain=1.0

[SourceFixes]
; Corrections copied exactly from the supplied PhilipsPatternRom converter.
RemoveChromaBlip=true
ReinstateReflectionCheck=true
