; Philips PM5644/G913 "Indian Head" 20 MHz ROM set
; Put this file in the same directory as the ten original EPROM dumps.
;
; This set is NOT the older G00 3-byte sprite-vector format.
; The 8051 firmware contains four PAL field tables, each 290 x 2 bytes.
; Luminance is reconstructed at the generator's native 20 MHz clock.

[Set]
Name=Philips PM5644/G913 Indian Head 20 MHz
Shortname=PM5644 G913
Standard=PAL
Decoder=PM5644_2BYTE_20MHZ

[ROM]
Luma0=EPROM_4008_102_58802_CSUM_A64A.BIN
Luma1=EPROM_4008_102_58812_CSUM_61E5.BIN
Luma2=EPROM_4008_102_58822_CSUM_3FCA.BIN
Luma3=EPROM_4008_102_58832_CSUM_757D.BIN
LumaLSB=EPROM_4008_102_58842_CSUM_E882.BIN
RY0=EPROM_4008_102_58852_CSUM_81F9.BIN
RY1=EPROM_4008_102_58862_CSUM_81F9.BIN
BY0=EPROM_4008_102_58872_CSUM_B4C3.BIN
BY1=EPROM_4008_102_58882_CSUM_B4C3.BIN
CPU=EPROM_4008_102_58761_CSUM_1800.BIN

[FieldTable]
; Proven from the 8051 firmware: four 290-line PAL fields.
Field0Start=0x50C8
Field1Start=0x530C
Field2Start=0x5550
Field3Start=0x5794
Length=0x0244

[Pattern]
; Fields 0+1 form PAL frame A, fields 2+3 frame B (anti-PAL sequence).
Frame=0
AlternateFrames=true

[Native]
; Same 20 MHz raster family as G/924. 1040 Y samples span 52.0 us.
; Chroma contains 520 original 8-bit samples at 10 MHz and is interpolated
; horizontally to the 1040-sample OpenScope YUV444 working raster.
Width=1040
Height=576
FieldLines=290

; Offset from the ROM line centre-address to the first visible sample.
; These values reproduce the G913 Indian Head raster from the original ROMs.
; The earlier 1024-wide reconstruction used 796/398. Extending the same
; centred 52 us window by eight samples on each side gives 804/402.
LumaBackOffsetSamples=804
ChromaBackOffsetSamples=402

[Timing]
; Generator-native sample clocks. OpenScope keeps the 20 MHz luminance raster
; through the source pipeline, so waveform MHz measurements use this clock.
LumaSampleRateHz=20000000
ChromaSampleRateHz=10000000
LineRateHz=15625
FrameRateHz=25

[Chroma]
; Timing is independent from amplitude. Phase is expressed in native 20 MHz
; luma-sample periods. +1.0 means chroma sample 0 is one 50 ns luma period
; later/right than luma sample 0. Fine-tune this value from the WFM if needed.
PhaseLumaSamples=4.0

; Small correction seen on the vectorscope/WFM: approximately +2 %.
Gain=1.02

[Levels]
; PM5644 video EPROMs contain DAC drive codes, not BT.601 code values.
YRawBlack=724
YRawWhite=164
YDigitalBlack=64
YDigitalWhite=940

ChromaDigitalCentre=512
ChromaDigitalPositive=848
RYRawCentre=128
RYRawAtPositive=63
BYRawCentre=128
BYRawAtPositive=82
