; Philips PM5644 G/924 V2 PAL 16:9 Pattern ROM set
; V2 reuses the unchanged V1 BY0/BY1 EPROMs (0062/0063), so keep all
; V1 and V2 dumps together in this one PM5644G924 directory.
; Put this file in the same directory as the ten original EPROM dumps.
;
; This is a 20 MHz rasterised PM5644 variant using four 2-byte field tables.
; 1040 active Y samples at 20 MHz = 52.0 us active picture time.
; Chroma is stored at half rate: 520 samples at 10 MHz.

[Set]
Name=Philips PM5644 G924 V2 PAL 16:9
Shortname=PM5644 G924
Standard=PAL
Decoder=PM5644_2BYTE_20MHZ
AspectRatio=16:9

[ROM]
Luma0=EPROM_4008_002_00552_CSUM_9F93.BIN
Luma1=EPROM_4008_002_00562_CSUM_3B85.BIN
Luma2=EPROM_4008_002_00572_CSUM_5608.BIN
Luma3=EPROM_4008_002_00582_CSUM_7589.BIN
LumaLSB=EPROM_4008_002_00592_CSUM_C1E0.BIN
RY0=EPROM_4008_002_00602_CSUM_F4C8.BIN
RY1=EPROM_4008_002_00612_CSUM_F167.BIN
BY0=EPROM_4008_002_00621_CSUM_06E1.BIN
BY1=EPROM_4008_002_00631_CSUM_FFB8.BIN
CPU=EPROM_4008_002_00542_CSUM_B800.BIN

[Timing]
LumaSampleRateHz=20000000
ChromaSampleRateHz=10000000
LineRateHz=15625
FrameRateHz=25

[Native]
; Four field tables, 291 entries per field. The PAL line-order reconstruction
; yields 578 candidate raster lines; crop one at the top and one at the bottom.
Width=1040
Height=576
VerticalCropTop=1
FieldLines=291

; Native active picture window relative to the centre-address pointer.
; 804 Y samples / 402 chroma samples before the centre pointer gives the
; complete 52 us active 16:9 raster seen in the original G/924 ROM data.
LumaBackOffsetSamples=804
ChromaBackOffsetSamples=402

[FieldTable]
Field0Start=0x6D1D
Field1Start=0x6F63
Field2Start=0x71A9
Field3Start=0x73EF
Length=0x246

[Pattern]
Frame=0
AlternateFrames=true

[Chroma]
; 20 MHz luma / 10 MHz chroma timing correction. Keep timing and gain
; independent: phase moves chroma horizontally; gain changes excursion only.
PhaseLumaSamples=4
Gain=1.02

[Levels]
; PM5644 video ROMs contain DAC drive codes rather than BT.601 code values.
YRawBlack=724
YRawWhite=164
YDigitalBlack=64
YDigitalWhite=940

ChromaDigitalCentre=512
ChromaDigitalPositive=848
RYRawCentre=128
RYRawAtPositive=63
BYRawCentre=128
BYRawAtPositive=82
